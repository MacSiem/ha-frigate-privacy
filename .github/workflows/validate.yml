name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: JS syntax (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail
      - name: Theming invariant (no OS prefers-color-scheme)
        run: |
          if grep -rln "@media (prefers-color-scheme" --include='*.js' .; then
            echo "FAIL: OS prefers-color-scheme present — cards must follow HA theme via :host(.bento-dark) luminance"
            exit 1
          fi
          echo "OK: no OS prefers-color-scheme"
      - name: A11y invariant (focus-visible present in cards)
        run: |
          miss=0
          for f in $(git ls-files '*.js' | grep -vE 'editor|\.min\.'); do
            if grep -q 'customElements.define' "$f" && grep -q ':host' "$f"; then
              grep -q ':focus-visible' "$f" || { echo "WARN: no :focus-visible in $f"; }
            fi
          done
          echo "a11y check done"
      - name: Runtime smoke (jsdom render)
        run: npm run test:smoke
      - name: Security and integration-only contracts
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Root/shipped bundle parity
        run: cmp -s ha-frigate-privacy.js custom_components/ha_frigate_privacy/www/ha-frigate-privacy-card.js
      - name: Canonical shared UI in actual shipped closures
        run: node scripts/verify-shared.cjs
      - name: HA frontend review hints
        continue-on-error: true
        run: |
          python3 scripts/ha_ci_advisory.py --root . ha-frigate-privacy.js shared/ha-tools-format.js shared/ha-tools-lists.js > "$RUNNER_TEMP/ha-ci-advisory.json"
          python3 -m json.tool "$RUNNER_TEMP/ha-ci-advisory.json"
